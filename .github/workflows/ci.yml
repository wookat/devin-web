name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck (server + web)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests (run against compiled dist)
        run: npm run test:unit
