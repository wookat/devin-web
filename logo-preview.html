<!doctype html><meta charset="utf-8"><title>logo candidates v3</title>
<style>
  body{font:12px system-ui;margin:20px;background:#888}
  .row{display:flex;gap:24px;align-items:flex-end}
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px}
  .dark{background:#141414;color:#eee;padding:14px;border-radius:8px}
  .light{background:#fafafa;color:#222;padding:14px;border-radius:8px}
  svg{display:block}
  .name{font:11px monospace;opacity:.7}
</style>
<div id="app"></div>
<script>
const pt=(c,r,deg)=>{const a=deg*Math.PI/180;return[c[0]+r*Math.cos(a),c[1]+r*Math.sin(a)]};
const f=n=>Math.round(n*100)/100;
const C=[8,8];
const Q=(a,b,c,d)=>`M${f(a[0])},${f(a[1])} L${f(b[0])},${f(b[1])} L${f(c[0])},${f(c[1])} L${f(d[0])},${f(d[1])} Z`;
const shrink=(q,k)=>{const cx=(q[0][0]+q[1][0]+q[2][0]+q[3][0])/4,cy=(q[0][1]+q[1][1]+q[2][1]+q[3][1])/4;
 return q.map(p=>[p[0]+(cx-p[0])*k,p[1]+(cy-p[1])*k])};
const hexv=(R,off=-90)=>[0,1,2,3,4,5].map(k=>pt(C,R,off+k*60));

/* A1 cube — faces shrunk toward own centroid (seam width k) */
function cube(k=0.06){const v=hexv(6.9);const CE=C;
 const top=shrink([v[0],v[1],CE,v[5]],k),right=shrink([CE,v[1],v[2],v[3]],k),left=shrink([v[5],CE,v[3],v[4]],k);
 return `<path d="${Q(...top)} ${Q(...right)} ${Q(...left)}" fill="currentColor"/>`}

/* A2 open cube — top face is a HOLE (receptacle workbench), side faces only */
function cubeOpen(k=0.06){const v=hexv(6.9);const CE=C;
 const hole=[v[0],v[1],CE,v[5]];
 const right=shrink([CE,v[1],v[2],v[3]],k),left=shrink([v[5],CE,v[3],v[4]],k);
 // hex outline band for the top rim
 const rim=`M${hexv(6.9).map(p=>f(p[0])+','+f(p[1])).join(' L')} Z`+
  `M${shrink(hole,-0.10).map(p=>f(p[0])+','+f(p[1])).join(' L')} Z`;
 return `<path d="${Q(...right)} ${Q(...left)}" fill="currentColor"/>
  <path d="${rim}" fill="currentColor" fill-rule="evenodd"/>`}

/* C1 bracket pair — interlocked chevrons, closed hexagon silhouette */
function bracketPair(){const R=6.9;
 // two C-brackets: left points right, right points left, offset vertically
 const B=(flip)=>{const s=flip?1:-1;
  const p=[pt([8+s*1.4,8],R,240),pt([8+s*1.4,8],R,180),pt([8+s*1.4,8],R,120),
           pt([8-s*3.4,8],R*0.55,120),pt([8+s*1.4,8],R*0.58,180),pt([8-s*3.4,8],R*0.55,240)];
  return `M${p.map(q=>f(q[0])+','+f(q[1])).join(' L')} Z`};
 return `<path d="${B(true)} ${B(false)}" fill="currentColor"/>`}

/* C2 closed hex ring with diagonal cut — Devin-style interlock, our geometry */
function hexCut(){const o=hexv(7.0),i=hexv(5.0);
 const ring=`M${o.map(p=>f(p[0])+','+f(p[1])).join(' L')} Z M${i.map(p=>f(p[0])+','+f(p[1])).join(' L')} Z`;
 // a diagonal slash piece overlapping the ring's top-left (interlock break)
 const slash=`M${f(i[5][0])},${f(i[5][1])} L${f(o[1][0]+0.6)},${f(o[1][1]-0.3)} L${f(o[1][0]+1.7)},${f(o[1][1]+0.6)} L${f(i[0][0]+0.4)},${f(i[0][1]+1.1)} Z`;
 return `<path d="${ring}" fill="currentColor" fill-rule="evenodd"/>
  <path d="${slash}" fill="currentColor"/>`}

/* D tri-chevron stack — nested sharp V chevrons pointing right (layers=agents) */
function triChev(){let d='';
 const mk=(cx,s)=>`M${f(cx-s)},${f(8-s*1.35)} L${f(cx+s*0.75)},8 L${f(cx-s)},${f(8+s*1.35)} L${f(cx-s+1.05)},${f(8+s*1.35)} L${f(cx+s*0.75+1.05)},8 L${f(cx-s+1.05)},${f(8-s*1.35)} Z`;
 d+=mk(3.0,3.5)+mk(8.5,3.5);
 return `<path d="${d}" fill="currentColor"/>`}

/* E shard-diamond — cube rotated 30deg (a sharp kite diamond made of 2 faces) */
function shardDia(k=0.05){
 const T=pt(C,7.0,-90),R=pt(C,7.0,0),B=pt(C,7.0,90),L=pt(C,7.0,180),CE=C;
 const top=shrink([T,R,CE,L],k),btm=shrink([CE,R,B,L],k);
 return `<path d="${Q(...top)} ${Q(...btm)}" fill="currentColor"/>`}

/* G star-tri — upward sharp triangle core + 3 small facet notches */
function triCore(){const T=pt(C,7.0,-90),BR=pt(C,7.0,30),BL=pt(C,7.0,150);
 const n=i=>pt(C,3.1,-90+i*120);
 return `<path d="M${f(T[0])},${f(T[1])} L${f(n(0)[0])},${f(n(0)[1])} L${f(BR[0])},${f(BR[1])} L${f(n(1)[0])},${f(n(1)[1])} L${f(BL[0])},${f(BL[1])} L${f(n(2)[0])},${f(n(2)[1])} Z" fill="currentColor"/>`}

const items=[
 ['A1 cube',()=>cube(0.06)],
 ['A2 cube-open',cubeOpen],
 ['C1 bracket-pair',bracketPair],
 ['C2 hex-cut',hexCut],
 ['D tri-chev',triChev],
 ['E shard-dia',shardDia],
 ['G tri-core',triCore],
];
const app=document.getElementById('app');
for(const [name,fn] of items){
 for(const bg of ['light','dark']){
  const cell=document.createElement('div');cell.className='cell '+bg;
  const row=document.createElement('div');row.className='row';
  for(const s of [16,24,48,96]){
   const w=document.createElement('div');w.className='cell';
   w.innerHTML=`<svg width="${s}" height="${s}" viewBox="0 0 16 16" fill="none">${fn()}</svg><span class="name">${s}</span>`;
   row.appendChild(w)}
  const label=document.createElement('div');label.className='name';label.textContent=name;
  cell.appendChild(row);cell.appendChild(label);app.appendChild(cell);
 }
}
</script>
